<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Model Dashboard{% endblock %} — NHS HeartLink</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nhsuk-frontend@9.5.0/dist/nhsuk.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-width-container nhsuk-header__container">
      <div class="nhsuk-header__logo">
        <a class="nhsuk-header__link" href="/" aria-label="NHS HeartLink homepage">
          <svg class="nhsuk-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 16" height="40" width="100">
            <path class="nhsuk-logo__background" fill="#005eb8" d="M0 0h40v16H0z"></path>
            <path class="nhsuk-logo__text" fill="#fff" d="M3.9 1.5h4.4l2.6 9h.1l1.8-9h3.3l-2.8 13H9l-2.7-9h-.1l-1.8 9H1.1M17.3 1.5h3.6l-1 4.9h4L25 1.5h3.5l-2.7 13h-3.5l1.1-5.6h-4.1l-1.2 5.6h-3.4M37.7 4.4c-.7-.3-1.6-.6-2.9-.6-1.4 0-2.5.2-2.5 1.3 0 1.8 5.1 1.2 5.1 5.1 0 3.6-3.3 4.5-6.4 4.5-1.3 0-2.9-.3-4-.7l.8-2.7c.7.4 2.1.7 3.2.7s2.8-.2 2.8-1.5c0-2.1-5.1-1.3-5.1-5 0-3.4 2.9-4.4 5.8-4.4 1.6 0 3.1.2 4 .6"></path>
          </svg>
          <span class="nhsuk-header__service-name">HeartLink — Prediction Model</span>
        </a>
      </div>
    </div>

    <div class="nhsuk-header__navigation-container">
      <nav class="nhsuk-header__navigation" id="header-navigation" role="navigation" aria-label="Model dashboard navigation">
        <ul class="nhsuk-header__navigation-list">
          <li class="nhsuk-header__navigation-item{% if active_page == 'model-home' %} nhsuk-header__navigation-item--current{% endif %}">
            <a class="nhsuk-header__navigation-link" href="/model">Overview</a>
          </li>
          <li class="nhsuk-header__navigation-item{% if active_page == 'eda' %} nhsuk-header__navigation-item--current{% endif %}">
            <a class="nhsuk-header__navigation-link" href="/model/eda">EDA</a>
          </li>
          <li class="nhsuk-header__navigation-item{% if active_page == 'classification' %} nhsuk-header__navigation-item--current{% endif %}">
            <a class="nhsuk-header__navigation-link" href="/model/classification">Classification</a>
          </li>
          <li class="nhsuk-header__navigation-item{% if active_page == 'regression' %} nhsuk-header__navigation-item--current{% endif %}">
            <a class="nhsuk-header__navigation-link" href="/model/regression">Regression</a>
          </li>
          <li class="nhsuk-header__navigation-item{% if active_page == 'clustering' %} nhsuk-header__navigation-item--current{% endif %}">
            <a class="nhsuk-header__navigation-link" href="/model/clustering">Clustering</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  {% block breadcrumb %}{% endblock %}

  <div class="nhsuk-width-container">
    <main class="nhsuk-main-wrapper" id="maincontent" role="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer role="contentinfo">
    <div class="nhsuk-footer" id="nhsuk-footer">
      <div class="nhsuk-width-container">
        <p class="nhsuk-footer__copyright">&copy; Crown copyright — HeartLink Pipeline Dashboard</p>
      </div>
    </div>
  </footer>
</body>
</html>
