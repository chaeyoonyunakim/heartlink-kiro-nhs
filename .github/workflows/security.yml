name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------
  # 1. Secret scanning — check for leaked credentials in code
  # ---------------------------------------------------------------
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 2. Dependency audit — check Python packages for known CVEs
  # ---------------------------------------------------------------
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install safety pip-audit
          pip install pandas numpy scikit-learn matplotlib seaborn flask hypothesis pytest

      - name: Run pip-audit
        run: pip-audit --strict --desc

      - name: Run Safety check
        run: safety check --output text
        continue-on-error: true

  # ---------------------------------------------------------------
  # 3. Static analysis — lint for security issues in Python code
  # ---------------------------------------------------------------
  static-analysis:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit on src/
        run: bandit -r src/ -f json -o bandit-src.json || true

      - name: Run Bandit on dashboard/
        run: bandit -r dashboard/ -f json -o bandit-dashboard.json || true

      - name: Display results
        run: |
          echo "=== src/ ==="
          bandit -r src/ -ll
          echo ""
          echo "=== dashboard/ ==="
          bandit -r dashboard/ -ll

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-reports
          path: bandit-*.json

  # ---------------------------------------------------------------
  # 4. CodeQL — GitHub's semantic code analysis
  # ---------------------------------------------------------------
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------
  # 5. Data leak check — ensure no patient data in commits
  # ---------------------------------------------------------------
  data-leak-check:
    name: Data leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no CSV data files are committed
        run: |
          echo "Checking for data files that should be gitignored..."
          FOUND=0
          for pattern in "data/*.csv" "data/*.xlsx" "*.csv.gz"; do
            if git ls-files --error-unmatch $pattern 2>/dev/null; then
              echo "ERROR: Data file tracked by git: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "FAIL: Patient data files found in repository"
            exit 1
          fi
          echo "PASS: No patient data files tracked"

      - name: Check .gitignore includes data/
        run: |
          if grep -q "^data/" .gitignore; then
            echo "PASS: data/ is in .gitignore"
          else
            echo "FAIL: data/ is NOT in .gitignore"
            exit 1
          fi

  # ---------------------------------------------------------------
  # 6. SAST summary — aggregate pass/fail
  # ---------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-audit, static-analysis, codeql, data-leak-check]
    steps:
      - name: All security checks passed
        run: echo "All security checks passed."
